<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Caracteres</title>
    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3ebfc;
            color: #16182b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }


        body.oscuro {
            background-color: #16182b;
            color: #ffffff;
        }


        .btn-tema {
            background-color: #8b5cf6;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: all 0.2s ease;
        }

        .btn-tema:hover {
            background-color: #7c3aed;
            transform: scale(1.05);
        }

        .contenedor {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        body.oscuro .contenedor {
            background-color: #22253f;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        h2 {
            margin-top: 0;
            color: #2d0d45;
            font-size: 1.25rem;
            margin-bottom: 15px;
            transition: color 0.3s ease;
        }

        body.oscuro h2 {
            color: #e2d5f8;
        }


        textarea {
            width: 100%;
            height: 130px;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95rem;
            resize: vertical;
            outline: none;
            background-color: #ffffff;
            color: #16182b;
            transition: border-color 0.2s ease, background-color 0.3s ease, color 0.3s ease;
        }

        textarea:focus {
            border-color: #8b5cf6;
        }

        /* Adaptación de Textarea a Modo Oscuro */
        body.oscuro textarea {
            background-color: #1a1c2e;
            border-color: #374151;
            color: #ffffff;
        }

        body.oscuro textarea:focus {
            border-color: #a78bfa;
        }


        p#contador {
            margin-top: 10px;
            text-align: right;
            font-size: 0.9rem;
            color: #6b7280;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        body.oscuro p#contador {
            color: #9ca3af;
        }


        .btn-contenedor-inferior {
            display: flex;
            justify-content: center;
            margin-top: 25px;
        }

        .btn-regresar {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #7c3aed;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25);
            transition: all 0.2s ease;
        }

        .btn-regresar:hover {
            background-color: #6d28d9;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(124, 58, 237, 0.35);
        }

        .btn-regresar:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>


    <button id="cambiar" class="btn-tema">🌙 Cambiar tema</button>

    <div class="contenedor">
        <h2>Escribe tu mensaje</h2>
        <textarea id="campo" placeholder="Escribe algo aquí..."></textarea>
        <p id="contador">0 caracteres</p>
    </div>

    <div class="btn-contenedor-inferior">
        <a href="Tarjeta.html" class="btn-regresar">
            &#8592; Regresar a Tarjeta
        </a>
    </div>

    <script>
        const boton = document.getElementById("cambiar");

        function alternarTema() {
            document.body.classList.toggle("oscuro");
            // Cambia el icono/texto del botón dinámicamente
            if (document.body.classList.contains("oscuro")) {
                boton.textContent = "☀️ Modo claro";
            } else {
                boton.textContent = "🌙 Modo oscuro";
            }
        }

        boton.addEventListener("click", alternarTema);
    </script>

    <script src="script.js"></script>
</body>
</html>
